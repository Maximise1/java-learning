spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/configs

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: http://service-discovery:8761/eureka
  instance:
    prefer-ip-address: true
